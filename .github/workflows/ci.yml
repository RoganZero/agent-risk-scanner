name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

      - name: Run Markdown CLI smoke test
        run: agent-risk-scan examples/unsafe-agent-project --output smoke-report.md

      - name: Run JSON CLI smoke test
        run: agent-risk-scan examples/unsafe-agent-project --format json --output smoke-report.json

      - name: Validate smoke reports
        run: python -c "import json, pathlib; md = pathlib.Path('smoke-report.md').read_text(encoding='utf-8'); data = json.loads(pathlib.Path('smoke-report.json').read_text(encoding='utf-8')); assert '# Agent Risk Scanner Report' in md; assert data['total_risks'] > 0; assert data['findings']"

